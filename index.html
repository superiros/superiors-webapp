<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Primary SEO -->
    <title>
      Superiors India | Brand Development, Financial Analysis & Business Growth Company
    </title>

    <meta
      name="description"
      content="Superiors India is a business consulting and brand development company providing financial analysis, business strategy, innovation, and technical training programs to help companies scale and grow."
    />

    <meta
      name="keywords"
      content="Superiors India, Business Consultant India, Brand Development Company, Financial Analysis Services, Business Strategy Firm, Innovation Consulting, Startup Growth India"
    />

    <meta name="author" content="Superiors India" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://superiors.in" />

    <!-- ✅ Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- ✅ Theme Color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- ✅ Open Graph Meta (Facebook, LinkedIn) -->
    <meta property="og:title" content="Superiors India | Business Consulting & Brand Development" />
    <meta
      property="og:description"
      content="Helping businesses grow with Brand Strategy, Financial Analysis, Technical Training & Innovation Consulting."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://superiors.in" />
    <meta property="og:image" content="https://superiors.in/og-image.jpg" />
    <meta property="og:site_name" content="Superiors India" />
    <meta property="og:locale" content="en_IN" />

    <!-- ✅ Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Superiors India | Business Consulting & Growth Experts" />
    <meta
      name="twitter:description"
      content="Professional Brand Development, Financial Analysis, and Business Growth Consulting in India."
    />
    <meta name="twitter:image" content="https://superiors.in/twitter-image.jpg" />

    <!-- ✅ Geo Tags -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.country" content="India" />

    <!-- ✅ Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ✅ Structured Data (Organization Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Superiors India",
        "url": "https://superiors.in",
        "logo": "https://superiors.in/logo.png",
        "description": "Superiors India is a business consulting firm specializing in brand development, financial analysis, innovation strategy, and technical training programs.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.linkedin.com/company/superiors",
          "https://www.instagram.com/superiors"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
